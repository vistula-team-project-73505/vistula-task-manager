<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Contribution</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
      background-color: #f8f9fa;
      color: #333;
    }
    h1 { margin-bottom: 1rem; }
    button {
      padding: 0.5rem 1rem;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #218838; }
    .result { margin-top: 1rem; font-size: 1.1rem; }
    a { display: inline-block; margin-top: 2rem; text-decoration: none; color: #0066cc; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>Team Contribution</h1>

  <button id="load-contributor">Show Contributor</button>

  <div class="result">
    Contributor Student ID: <span id="contributor-student-id"></span>
  </div>

  <div>
    <a href="index.html">← Back to Task Manager</a>
  </div>

  <script>
    document.getElementById("load-contributor").addEventListener("click", async () => {
      try {
        const response = await fetch("contribution.json");
        if (!response.ok) throw new Error("Could not fetch contribution.json");
        const data = await response.json();
        document.getElementById("contributor-student-id").textContent = data.contributorStudentId;
      } catch (error) {
        alert("Error loading contributor data: " + error.message);
      }
    });
  </script>

</body>
</html>
